target: rembi
name: Generic REMBI completeness
description: >
  Repository-neutral completeness profile for REMBI (Recommended Metadata for Biological
  Images). Required REMBI 1.5 fields fail; recommended fields that make data reusable warn.
  Use before choosing a repository or for internal facility archives.
retrieved: 2026-11-02
sources:
  rembi-paper:
    title: Sarkans et al. 2021, REMBI - Recommended Metadata for Biological Images, Nature Methods 18:1418
    url: https://doi.org/10.1038/s41592-021-01166-8
  rembi-model:
    title: REMBI Model Reference (v1.5)
    url: https://www.ebi.ac.uk/bioimage-archive/rembi-model-reference/
  rembi-overview:
    title: REMBI Overview
    url: https://www.ebi.ac.uk/bioimage-archive/rembi-help-overview/

rules:
  - id: REMBI-META-001
    title: Metadata file present
    check: metadata_present
    fix: Create submission.yaml (run `micro-validate --template rembi > submission.yaml`).
    sources: [rembi-model]
  # Study
  - id: REMBI-STUDY-001
    title: Study title
    check: field_present
    params: {path: study.title}
    fix: Add study.title.
    sources: [rembi-model, rembi-paper]
  - id: REMBI-STUDY-002
    title: Study description
    check: field_present
    params: {path: study.description}
    fix: Add study.description.
    sources: [rembi-model]
  - id: REMBI-STUDY-003
    title: Keywords
    check: field_present
    params: {path: study.keywords}
    fix: Add study.keywords.
    sources: [rembi-model]
  - id: REMBI-STUDY-004
    title: Authors (name + affiliation)
    check: field_present
    params: {path: 'study.authors[*].affiliation.name'}
    fix: Every author needs an affiliation.
    sources: [rembi-model]
  - id: REMBI-STUDY-005
    title: Author last names
    check: field_present
    params: {any_of: ['study.authors[*].last_name', 'study.authors[*].name']}
    fix: Every author needs last_name and first_name.
    sources: [rembi-model]
  - id: REMBI-STUDY-006
    title: Licence (recommended)
    check: field_present
    severity: warn
    params: {path: study.license}
    fix: State a licence (CC0 or CC BY 4.0 maximise reuse).
    sources: [rembi-model]
  - id: REMBI-STUDY-007
    title: Funding (recommended)
    check: field_present
    severity: warn
    params: {path: 'study.funding[*].funding_statement'}
    fix: Add funding statements and grant references.
    sources: [rembi-model]
  - id: REMBI-STUDY-008
    title: Related publication (recommended)
    check: field_present
    severity: warn
    params: {any_of: ['study.publications[*].doi', 'study.publications[*].pubmed_id']}
    fix: Link the publication by DOI or PubMed ID.
    sources: [rembi-model, rembi-paper]
  # Study component
  - id: REMBI-COMP-001
    title: Study component(s) named and described
    check: field_present
    params: {path: 'study_components[*].description'}
    fix: Add study_components with name and description.
    sources: [rembi-model, rembi-overview]
  # Biosample
  - id: REMBI-BIOS-001
    title: Organism scientific name
    check: field_present
    params: {path: 'biosample[*].organism[*].scientific_name'}
    fix: Set organism scientific_name.
    sources: [rembi-model]
  - id: REMBI-BIOS-002
    title: Organism NCBI taxon
    check: field_present
    severity: warn
    params: {path: 'biosample[*].organism[*].ncbi_taxon', pattern: '^(NCBITaxon_)?\d+$'}
    fix: Set ncbi_taxon (e.g. NCBITaxon_10090).
    sources: [rembi-model]
  - id: REMBI-BIOS-003
    title: Biological entity
    check: field_present
    params: {path: 'biosample[*].biological_entity'}
    fix: Set biosample.biological_entity.
    sources: [rembi-model]
  - id: REMBI-BIOS-004
    title: Variables described (recommended)
    check: field_present
    severity: warn
    params: {any_of: ['biosample[*].intrinsic_variables', 'biosample[*].extrinsic_variables', 'biosample[*].experimental_variables']}
    fix: Describe intrinsic (genotype), extrinsic (treatment) or experimental variables.
    sources: [rembi-model, rembi-paper]
  # Specimen
  - id: REMBI-SPEC-001
    title: Sample preparation
    check: field_present
    params: {path: 'specimen[*].sample_preparation'}
    fix: Describe sample preparation.
    sources: [rembi-model]
  - id: REMBI-SPEC-002
    title: Growth protocol (recommended)
    check: field_present
    severity: warn
    params: {path: 'specimen[*].growth_protocol'}
    fix: Describe the growth protocol.
    sources: [rembi-model]
  # Image acquisition
  - id: REMBI-ACQ-001
    title: Imaging method
    check: field_present
    params: {path: 'image_acquisition[*].imaging_method'}
    fix: Set imaging_method (FBbi term).
    sources: [rembi-model]
  - id: REMBI-ACQ-002
    title: Imaging method as ontology term (recommended)
    check: field_present
    severity: warn
    params: {path: 'image_acquisition[*].imaging_method.ontology_id', pattern: 'FBbi[_:]\d+'}
    fix: Use an FBbi ontology id for imaging_method (e.g. FBbi_00000246 for fluorescence microscopy).
    sources: [rembi-model]
  - id: REMBI-ACQ-003
    title: Imaging instrument
    check: field_present
    params: {path: 'image_acquisition[*].imaging_instrument'}
    fix: Describe the instrument.
    sources: [rembi-model]
  - id: REMBI-ACQ-004
    title: Acquisition parameters
    check: field_present
    params: {path: 'image_acquisition[*].image_acquisition_parameters'}
    fix: Describe acquisition parameters.
    sources: [rembi-model]
  # Analysis / correlation (conditional)
  - id: REMBI-ANA-001
    title: Analysis overview (when analysis included)
    check: field_present
    params: {path: 'image_analysis[*].analysis_overview', if_present: image_analysis}
    fix: Give analysis_overview.
    sources: [rembi-model]
  - id: REMBI-CORR-001
    title: Correlation alignment (when correlation included)
    check: field_present
    params: {path: 'image_correlation[*].spatial_and_temporal_alignment', if_present: image_correlation}
    fix: Describe spatial_and_temporal_alignment, fiducials_used and transformation_matrix.
    sources: [rembi-model]
  # Image data (REMBI image-level component, checked from files)
  - id: REMBI-IMG-001
    title: Images readable
    check: images_readable
    fix: Replace unreadable files.
    sources: [rembi-overview]
  - id: REMBI-IMG-002
    title: Open formats (recommended)
    check: formats_accepted
    params:
      levels: {ome-tiff: pass, ome-zarr: pass, ome-zarr-zip: pass, tiff: warn, mrc: pass, vendor: warn, raster: warn}
      messages:
        tiff: "plain TIFF lacks structured metadata; prefer OME-TIFF"
        vendor: "proprietary format; also provide OME-TIFF/OME-Zarr for long-term reuse"
        raster: "PNG/JPEG hold no microscopy metadata; fine for masks and figures, not for raw acquisitions"
    fix: Provide images in OME-TIFF or OME-Zarr.
    sources: [rembi-paper]
  - id: REMBI-IMG-003
    title: Image-level metadata (pixel sizes) present
    check: ome_metadata
    severity: warn
    params: {pixel_size_axes: [x, y]}
    fix: Record physical pixel sizes in the image metadata.
    sources: [rembi-overview]
  - id: REMBI-IMG-004
    title: Consistent series
    check: series_consistent
    severity: warn
    params:
      group_by: directory
      fields: {channels: problem, pixel_size: problem, dtype: warning, xy: warning}
    fix: Keep one acquisition setting per folder/series.
    sources: [rembi-paper]
