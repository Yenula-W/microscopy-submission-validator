name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.12"
          # tests for the optional [vendor] extra run here and skip cleanly everywhere else
          - os: ubuntu-latest
            python: "3.12"
            extras: "dev,vendor"
    steps:
      - uses: actions/checkout@v4
      # setup-python has no 3.9 build for current Ubuntu images; uv's standalone builds do
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv --python ${{ matrix.python }} .venv
      - run: uv pip install ".[${{ matrix.extras || 'dev' }}]"
      - run: .venv/bin/python -V && .venv/bin/pytest -q
      - name: CLI smoke test
        run: |
          .venv/bin/micro-validate --version
          .venv/bin/micro-validate --list-targets
          .venv/bin/micro-validate --template bia > /dev/null
