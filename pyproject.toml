[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micro-validate"
version = "0.1.0"
description = "Pre-submission validator for microscopy datasets (BioImage Archive, IDR, REMBI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6",
  "numpy>=1.24",
  "tifffile>=2023.7.10",
  "ome-types>=0.5",
  "zarr>=2.16",
]

[project.optional-dependencies]
vendor = ["bioio>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
micro-validate = "micro_validate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
micro_validate = ["rules/*.yaml", "templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
