[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micro-validate"
version = "0.1.0"
description = "Pre-submission validator for microscopy datasets (BioImage Archive, IDR, REMBI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yenula Wickramasinghe" }]
keywords = ["microscopy", "REMBI", "BioImage Archive", "IDR", "OME-TIFF", "OME-Zarr", "validation"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "pyyaml>=6",
  "numpy>=1.24",
  "tifffile>=2023.7.10",
  "ome-types>=0.5",
  "zarr>=2.16",
  "imagecodecs>=2023.1.23",  # LZW/deflate/JPEG-compressed TIFFs (common in BIA submissions)
]

[project.urls]
Homepage = "https://github.com/Yenula-W/microscopy-submission-validator"
Issues = "https://github.com/Yenula-W/microscopy-submission-validator/issues"
Evaluation = "https://github.com/Yenula-W/microscopy-submission-validator/blob/main/EVALUATION.md"

[project.optional-dependencies]
vendor = ["bioio>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
micro-validate = "micro_validate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
micro_validate = ["rules/*.yaml", "templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
